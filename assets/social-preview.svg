<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SignalWall by Nestcells</title>
  <desc id="desc">Live wallpapers that respect your attention.</desc>
  <defs>
    <linearGradient id="text" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="0.56" stop-color="#e7c174"/>
      <stop offset="1" stop-color="#98d6c8"/>
    </linearGradient>
    <linearGradient id="scene" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17100f"/>
      <stop offset="0.55" stop-color="#0a0b09"/>
      <stop offset="1" stop-color="#071211"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#fff8ed" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#070806"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M66 80h58" stroke="#98d6c8" stroke-width="8" stroke-linecap="round"/>
  <rect x="66" y="70" width="14" height="14" fill="#e7c174"/>
  <text x="66" y="154" fill="#98d6c8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">OPEN SOURCE · WINDOWS · MULTI-MONITOR</text>
  <text x="60" y="300" fill="#fff8ed" font-family="Inter, Arial, sans-serif" font-size="122" font-weight="820">SignalWall</text>
  <text x="66" y="372" fill="#fff8ed" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="760">Live wallpapers that respect your attention.</text>
  <text x="66" y="422" fill="#aaa59b" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650">Built-in control center · Per-screen themes · No telemetry</text>
  <g transform="translate(66 486)">
    <rect width="330" height="104" fill="url(#scene)" stroke="#fff8ed" stroke-opacity="0.18"/>
    <rect x="340" width="390" height="104" fill="url(#scene)" stroke="#fff8ed" stroke-opacity="0.18"/>
    <rect x="740" width="330" height="104" fill="url(#scene)" stroke="#fff8ed" stroke-opacity="0.18"/>
    <text x="22" y="30" fill="#aaa59b" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">LEFT 02</text>
    <text x="362" y="30" fill="#aaa59b" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">CENTER 03</text>
    <text x="762" y="30" fill="#aaa59b" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">RIGHT 01</text>
    <text x="22" y="74" fill="url(#text)" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="820">Every pixel earns attention.</text>
    <text x="362" y="74" fill="url(#text)" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="820">Attention has a budget.</text>
    <text x="762" y="74" fill="url(#text)" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="820">Quiet systems guide better.</text>
  </g>
</svg>
